name: ragging_reporting_mobile_app
description: Mobile app for Sri Lankan Ragging Reporting System
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  
  # Backend & Database
  supabase_flutter: ^1.10.25
  
  # State Management
  provider: ^6.1.1
  
  # Environment & Configuration
  flutter_dotenv: ^5.1.0
  
  # UI & Design
  lottie: ^2.6.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  
  # Storage & Security
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  
  # Media & Files
  image_picker: ^1.0.4
  file_picker: ^6.1.1
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.1
  url_launcher: ^6.1.14
  path: ^1.8.3
  
  # Networking & HTTP
  http: ^1.1.0
  
  # Charts & Analytics
  fl_chart: ^0.64.0
  
  # Navigation & Routing
  go_router: ^12.1.3
  
  # Notifications
  flutter_local_notifications: ^16.3.2
  
  # Animations
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3
  
  # Testing
  mockito: ^5.4.4
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - .env
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700